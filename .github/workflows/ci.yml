name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm next typegen
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm format:check
      - name: Production build
        run: pnpm build
        env:
          # Build-time only: no DB is touched while prerendering the shells.
          DATABASE_URL: postgres://ci@localhost:5432/ci
          SESSION_SECRET: ci-build-only-not-a-secret-0123456789
          NEXT_PUBLIC_SITE_URL: https://park-roulette.vercel.app
